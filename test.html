<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>청년지원 알리미 — Test Suite</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:#F8FAFC;color:#1E293B;padding:24px}
  h1{font-size:20px;font-weight:800;margin-bottom:4px}
  .meta{font-size:13px;color:#64748B;margin-bottom:24px}
  .summary{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
  .sum-card{padding:14px 20px;border-radius:12px;font-weight:700;font-size:22px;min-width:110px;text-align:center}
  .sum-card span{display:block;font-size:11px;font-weight:500;margin-top:3px;opacity:.8}
  .s-pass{background:#ECFDF5;color:#059669}
  .s-fail{background:#FEF2F2;color:#DC2626}
  .s-total{background:#EEF2FF;color:#3563E9}
  .section{margin-bottom:20px}
  .section-title{font-size:13px;font-weight:700;color:#475569;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;padding-left:4px}
  .test-row{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:8px;margin-bottom:6px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .test-row.pass{border-left:4px solid #059669}
  .test-row.fail{border-left:4px solid #DC2626}
  .test-icon{font-size:16px;flex-shrink:0;margin-top:1px}
  .test-info{flex:1;min-width:0}
  .test-name{font-size:13px;font-weight:600}
  .test-err{font-size:12px;color:#DC2626;margin-top:4px;background:#FEF2F2;padding:6px 8px;border-radius:6px;word-break:break-all;font-family:monospace}
  .test-detail{font-size:11px;color:#94A3B8;margin-top:3px}
  .legend{background:#fff;border-radius:12px;padding:16px;margin-bottom:20px;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .legend h3{font-size:13px;font-weight:700;color:#475569;margin-bottom:8px}
  .legend-row{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid #F1F5F9}
  .legend-row:last-child{border:none}
  .level-badge{display:inline-block;padding:2px 8px;border-radius:9999px;font-size:11px;font-weight:700}
  .lv-urgent{background:#FEF2F2;color:#DC2626}.lv-high{background:#ECFDF5;color:#059669}
  .lv-check{background:#FFFBEB;color:#D97706}.lv-agency{background:#F5F3FF;color:#7C3AED}
  .lv-inelig{background:#F3F4F6;color:#6B7280}
</style>
</head>
<body>

<h1>🧪 청년지원 알리미 — Test Suite</h1>
<div class="meta" id="run-meta"></div>

<div class="summary" id="summary"></div>

<div class="legend">
  <h3>매칭 레벨 기준</h3>
  <div class="legend-row"><span class="level-badge lv-urgent">URGENT</span> 마감 임박(D-14 이내) + 모든 조건 충족</div>
  <div class="legend-row"><span class="level-badge lv-high">HIGH</span> 모든 조건 충족 (마감 여유)</div>
  <div class="legend-row"><span class="level-badge lv-check">CHECK</span> 프로필 정보 부족으로 판단 불가</div>
  <div class="legend-row"><span class="level-badge lv-agency">AGENCY</span> 기본 조건 충족, 복잡 조건 → 기관 확인 필요</div>
  <div class="legend-row"><span class="level-badge lv-inelig">INELIG</span> 하나 이상 조건 명확 미충족</div>
</div>

<div id="results"></div>

<!-- ── 의존 스크립트 로드 ─────────────────────────── -->
<script src="logic.js"></script>
<script src="data/policies.js"></script>
<script src="data/profiles.js"></script>

<script>
/* ═══════════════════════════════════════════════════════
   MINI TEST FRAMEWORK
═══════════════════════════════════════════════════════ */
var _sections = [];
var _curSection = null;

function describe(name) {
  _curSection = { name: name, tests: [] };
  _sections.push(_curSection);
}

function it(name, fn) {
  var t = { name: name, ok: false, err: null, detail: null };
  try {
    fn();
    t.ok = true;
  } catch(e) {
    t.err = e.message;
  }
  _curSection.tests.push(t);
}

/* 단언 헬퍼 */
function eq(actual, expected, label) {
  if (actual !== expected)
    throw new Error((label ? label + ': ' : '') + '기대값 [' + JSON.stringify(expected) + '], 실제값 [' + JSON.stringify(actual) + ']');
}
function oneOf(actual, arr, label) {
  if (arr.indexOf(actual) < 0)
    throw new Error((label ? label + ': ' : '') + '[' + actual + '] 이 허용값 [' + arr.join(', ') + '] 에 없음');
}
function ok(cond, msg) {
  if (!cond) throw new Error(msg || '단언 실패');
}
function hasCriterion(arr, key, label) {
  var found = arr.some(function(x) { return x.criterion === key; });
  if (!found) throw new Error((label || 'criterion') + ' [' + key + '] 가 배열에 없음 / 실제: ' + JSON.stringify(arr.map(function(x){return x.criterion;})));
}
function notHasCriterion(arr, key, label) {
  var found = arr.some(function(x) { return x.criterion === key; });
  if (found) throw new Error((label || 'criterion') + ' [' + key + '] 가 있으면 안 되는데 발견됨');
}
function policyById(id) {
  var p = POLICIES.filter(function(x){ return x.id === id; })[0];
  if (!p) throw new Error('Policy not found: ' + id);
  return p;
}

/* ═══════════════════════════════════════════════════════
   TEST CASES
═══════════════════════════════════════════════════════ */

/* ──────────────────────────────────────
   SECTION A: matchPolicy() — 레벨 판정
────────────────────────────────────── */
describe('A. matchPolicy() — 5단계 레벨 판정');

it('A-01 서울 미취업 졸업자 × 취업성공패키지 → HIGH', function() {
  var r = matchPolicy(SAMPLE_PROFILES.seoulUnemployed, policyById('p004'));
  // 마감 D-93이므로 URGENT 아닌 HIGH
  eq(r.level, MATCH.HIGH);
});

it('A-02 서울 미취업 졸업자 × 청년내일저축계좌 → INELIG (취업 상태 불일치)', function() {
  var r = matchPolicy(SAMPLE_PROFILES.seoulUnemployed, policyById('p001'));
  eq(r.level, MATCH.INELIG);
});

it('A-03 경기 청년 × 서울청년수당 → INELIG (지역 불일치)', function() {
  var r = matchPolicy(SAMPLE_PROFILES.gyeonggiUnemployed, policyById('p011'));
  eq(r.level, MATCH.INELIG);
});

it('A-04 서울 재학생 × 국가장학금 → HIGH (D-16, 모든 조건 충족)', function() {
  var r = matchPolicy(SAMPLE_PROFILES.seoulStudent, policyById('p010'));
  oneOf(r.level, [MATCH.HIGH, MATCH.AGENCY]); // 복잡 조건 있어서 AGENCY 가능
});

it('A-05 서울 재직자(SME) × 청년내일채움공제 → AGENCY (기업 확인 필요)', function() {
  var r = matchPolicy(SAMPLE_PROFILES.seoulEmployee, policyById('p006'));
  eq(r.level, MATCH.AGENCY);
});

it('A-06 소득 미입력 사용자 × 청년내일저축계좌 → CHECK', function() {
  var noIncome = Object.assign({}, SAMPLE_PROFILES.seoulEmployee, {
    employmentStatus: 'employed', incomeLevel: '',
  });
  var r = matchPolicy(noIncome, policyById('p001'));
  eq(r.level, MATCH.CHECK);
});

it('A-07 서울 미취업 × 청년 월세 지원 (D-2) → URGENT', function() {
  var r = matchPolicy(SAMPLE_PROFILES.seoulUnemployed, policyById('p003'));
  eq(r.level, MATCH.URGENT);
  ok(r.dday !== null && r.dday <= 14, '마감이 D-14 이내여야 함, 실제 dday=' + r.dday);
});

it('A-08 서울 재학생 × 청년내일저축계좌 → INELIG (취업 상태 불일치)', function() {
  var r = matchPolicy(SAMPLE_PROFILES.seoulStudent, policyById('p001'));
  eq(r.level, MATCH.INELIG);
});

it('A-09 서울 제대군인 × 전역 청년 취업 지원 → AGENCY (전역 증명 확인 필요)', function() {
  var r = matchPolicy(SAMPLE_PROFILES.seoulVeteran, policyById('p015'));
  eq(r.level, MATCH.AGENCY);
  ok(r.reasons.complex.length > 0, 'complex 조건이 있어야 함');
});

it('A-10 서울 재직자(SME) × 청년도약계좌 → HIGH (income level3 ≤ level5)', function() {
  var r = matchPolicy(SAMPLE_PROFILES.seoulEmployee, policyById('p002'));
  eq(r.level, MATCH.HIGH);
});

it('A-11 서울 재직자 × 희망두배 청년통장 → INELIG (income level3 > level2)', function() {
  var r = matchPolicy(SAMPLE_PROFILES.seoulEmployee, policyById('p012'));
  eq(r.level, MATCH.INELIG);
});

it('A-12 서울 제대군인 × 청년 월세 지원 → CHECK (isHomeless null)', function() {
  var r = matchPolicy(SAMPLE_PROFILES.seoulVeteran, policyById('p003'));
  eq(r.level, MATCH.CHECK);
});

/* ──────────────────────────────────────
   SECTION B: getMatchReasons() — 사유 분류
────────────────────────────────────── */
describe('B. getMatchReasons() — positive / unknown / negative / complex');

it('B-01 나이 조건 충족 → positive에 "나이" 포함', function() {
  var r = getMatchReasons(SAMPLE_PROFILES.seoulUnemployed, policyById('p004'));
  hasCriterion(r.positive, '나이');
});

it('B-02 나이 초과 → negative에 "나이" 포함', function() {
  var oldUser = Object.assign({}, SAMPLE_PROFILES.seoulUnemployed, { age: 40 });
  var r = getMatchReasons(oldUser, policyById('p004'));
  hasCriterion(r.negative, '나이');
  notHasCriterion(r.positive, '나이');
});

it('B-03 취업 상태 불일치 → negative에 "취업 상태" 포함', function() {
  var r = getMatchReasons(SAMPLE_PROFILES.seoulStudent, policyById('p001'));
  hasCriterion(r.negative, '취업 상태');
});

it('B-04 소득 미입력 → unknown에 "소득 수준" 포함', function() {
  var noIncome = Object.assign({}, SAMPLE_PROFILES.seoulUnemployed, { incomeLevel: '' });
  var r = getMatchReasons(noIncome, policyById('p001'));
  hasCriterion(r.unknown, '소득 수준');
});

it('B-05 소득 기준 초과 → negative에 "소득 수준" 포함', function() {
  // seoulEmployee: level3 / p001 maxLevel: level2 → 초과
  var r = getMatchReasons(SAMPLE_PROFILES.seoulEmployee, policyById('p001'));
  hasCriterion(r.negative, '소득 수준');
});

it('B-06 서울 거주자 × 서울형 정책 → positive에 "거주 지역" 포함', function() {
  var r = getMatchReasons(SAMPLE_PROFILES.seoulUnemployed, policyById('p011'));
  hasCriterion(r.positive, '거주 지역');
});

it('B-07 경기 거주자 × 서울형 정책 → negative에 "거주 지역" 포함', function() {
  var r = getMatchReasons(SAMPLE_PROFILES.gyeonggiUnemployed, policyById('p011'));
  hasCriterion(r.negative, '거주 지역');
});

it('B-08 무주택 미입력 × 무주택 조건 정책 → unknown에 "무주택" 포함', function() {
  var r = getMatchReasons(SAMPLE_PROFILES.seoulVeteran, policyById('p003'));
  hasCriterion(r.unknown, '무주택');
});

it('B-09 무주택 보유자 × 무주택 조건 정책 → negative에 "무주택" 포함', function() {
  var r = getMatchReasons(SAMPLE_PROFILES.seoulStudent, policyById('p003'));
  hasCriterion(r.negative, '무주택');
});

it('B-10 전국형 정책 (regions: []) → "거주 지역" 판정 없음', function() {
  var r = getMatchReasons(SAMPLE_PROFILES.gyeonggiUnemployed, policyById('p004'));
  notHasCriterion(r.positive, '거주 지역');
  notHasCriterion(r.negative, '거주 지역');
  notHasCriterion(r.unknown,  '거주 지역');
});

/* ──────────────────────────────────────
   SECTION C: getDeadlineBucket() — 마감 버킷
────────────────────────────────────── */
describe('C. getDeadlineBucket() — D-day 버킷 분류');

it('C-01 상시 정책 → OPEN', function() {
  eq(getDeadlineBucket(policyById('p005')), DDAY_B.OPEN);
});

it('C-02 D-2 정책 (p003) → D3 이하 버킷', function() {
  var b = getDeadlineBucket(policyById('p003'));
  oneOf(b, [DDAY_B.D1, DDAY_B.D3]);
});

it('C-03 D-11 정책 (p013) → D14 버킷', function() {
  eq(getDeadlineBucket(policyById('p013')), DDAY_B.D14);
});

/* ──────────────────────────────────────
   SECTION D: buildNotifications() — 알림 생성
────────────────────────────────────── */
describe('D. buildNotifications() — 알림 생성 규칙');

it('D-01 URGENT 정책은 알림 생성됨', function() {
  var results = computeAllMatches(SAMPLE_PROFILES.seoulUnemployed, POLICIES);
  var notifs  = buildNotifications(results);
  var urgentResults = results.filter(function(r){ return r.level === MATCH.URGENT; });
  ok(urgentResults.length > 0, '서울 미취업 졸업자는 URGENT 정책이 있어야 함');
  ok(notifs.length > 0, '알림이 1개 이상 생성되어야 함');
});

it('D-02 INELIG 정책은 알림에 포함 안 됨', function() {
  var results = computeAllMatches(SAMPLE_PROFILES.seoulUnemployed, POLICIES);
  var notifs  = buildNotifications(results);
  var ineligInNotif = notifs.filter(function(n) {
    var match = results.filter(function(r){ return r.policy.id === n.policyId; })[0];
    return match && match.level === MATCH.INELIG;
  });
  eq(ineligInNotif.length, 0, 'INELIG 정책이 알림에 포함되면 안 됨');
});

it('D-03 경기 청년의 서울 전용 정책은 알림 없음', function() {
  var results = computeAllMatches(SAMPLE_PROFILES.gyeonggiUnemployed, POLICIES);
  var notifs  = buildNotifications(results);
  var seoulPolicies = ['p011','p012','p013','p014'];
  var seoulInNotif  = notifs.filter(function(n){ return seoulPolicies.indexOf(n.policyId) >= 0; });
  eq(seoulInNotif.length, 0, '경기 거주자의 서울 전용 정책 알림이 0이어야 함');
});

it('D-04 알림은 dday 오름차순 정렬', function() {
  var results = computeAllMatches(SAMPLE_PROFILES.seoulUnemployed, POLICIES);
  var notifs  = buildNotifications(results);
  for (var i = 1; i < notifs.length; i++) {
    ok(notifs[i].dday >= notifs[i-1].dday, '알림이 dday 오름차순이 아님: idx=' + i);
  }
});

it('D-05 동일 정책 알림 중복 없음', function() {
  var results = computeAllMatches(SAMPLE_PROFILES.seoulUnemployed, POLICIES);
  var notifs  = buildNotifications(results);
  var ids     = notifs.map(function(n){ return n.policyId; });
  var unique  = ids.filter(function(id, i){ return ids.indexOf(id) === i; });
  eq(unique.length, notifs.length, '중복 알림 있음: ' + ids.join(','));
});

it('D-06 CHECK 레벨 정책은 알림 미생성', function() {
  var results = computeAllMatches(SAMPLE_PROFILES.seoulVeteran, POLICIES);
  var notifs  = buildNotifications(results);
  var checkInNotif = notifs.filter(function(n) {
    var match = results.filter(function(r){ return r.policy.id === n.policyId; })[0];
    return match && match.level === MATCH.CHECK;
  });
  eq(checkInNotif.length, 0, 'CHECK 정책이 알림에 포함되면 안 됨');
});

/* ═══════════════════════════════════════════════════════
   RENDER RESULTS
═══════════════════════════════════════════════════════ */
(function renderResults() {
  var pass = 0, fail = 0;
  _sections.forEach(function(s) {
    s.tests.forEach(function(t) { t.ok ? pass++ : fail++; });
  });
  var total = pass + fail;

  // 실행 메타
  document.getElementById('run-meta').textContent =
    '실행 시각: ' + new Date().toLocaleString('ko-KR') + ' | 총 ' + total + '개 케이스';

  // 요약 카드
  document.getElementById('summary').innerHTML =
    '<div class="sum-card s-total">' + total + '<span>전체</span></div>' +
    '<div class="sum-card s-pass">' + pass + '<span>통과 ✅</span></div>' +
    '<div class="sum-card s-fail">' + fail + '<span>실패 ❌</span></div>';

  // 섹션별 결과
  var html = '';
  _sections.forEach(function(s) {
    html += '<div class="section">';
    html += '<div class="section-title">' + s.name + '</div>';
    s.tests.forEach(function(t) {
      html += '<div class="test-row ' + (t.ok ? 'pass' : 'fail') + '">';
      html += '<div class="test-icon">' + (t.ok ? '✅' : '❌') + '</div>';
      html += '<div class="test-info">';
      html += '<div class="test-name">' + t.name + '</div>';
      if (t.err) html += '<div class="test-err">' + t.err + '</div>';
      html += '</div></div>';
    });
    html += '</div>';
  });

  document.getElementById('results').innerHTML = html;

  // 콘솔 요약
  console.log('=== Test Result: ' + pass + '/' + total + ' passed ===');
  _sections.forEach(function(s) {
    s.tests.forEach(function(t) {
      if (!t.ok) console.error('[FAIL] ' + t.name + '\n  ' + t.err);
    });
  });
})();
</script>
</body>
</html>
